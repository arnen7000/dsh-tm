name: "Bug report / 报告一个问题"
description: "Something broken — UI, startup, install or uninstall / 界面不对、启动失败、安装或卸载异常"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Redact before posting.** Logs contain your Windows username and absolute paths.
        Replace the username with `<用户名>` and drive paths with `<home>` / `<base>`.

        **粘贴日志前请先脱敏。** 日志里含 Windows 用户名和绝对路径，
        请把用户名换成 `<用户名>`、盘符路径换成 `<home>` / `<base>`。

        Security issues (credential leaks, unintended data deletion) must **not** be filed here.
        Please report them privately as described in [SECURITY.md](https://github.com/arnen7000/dsh-tm/blob/main/SECURITY.md).
        安全问题（凭据泄露、误删用户数据等）**不要在这里开 issue**，请按
        [SECURITY.md](https://github.com/arnen7000/dsh-tm/blob/main/SECURITY.md) 私密报告。

  - type: input
    id: version
    attributes:
      label: "Manager version / 管理器版本"
      description: "Shown in Settings, or in the VERSION file at repo root / 标题栏「设置」里能看到，或看仓库根目录的 VERSION 文件"
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: "Windows version / Windows 版本"
      description: "Press Win + R and run winver / 按 Win + R 输入 winver 查看"
      placeholder: "Windows 11 26H1 (26300)"
    validations:
      required: true

  - type: input
    id: slot
    attributes:
      label: "Affected slot and dsh version / 涉及的槽与 dsh 版本"
      description: "For example dshV2 = 0.2.1-alpha.2, port 5080 / 例如 dshV2 = 0.2.1-alpha.2，端口 5080"
      placeholder: "dshV2 = 0.2.1-alpha.2, port 5080"
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: "Where it breaks / 出问题的环节"
      multiple: true
      options:
        - "Install official version (npm) / 安装官方版（npm 下载安装）"
        - "Scan and adopt existing dsh / 扫描并纳入已装 dsh"
        - "Start / stop / start all / stop all / 启动、停止、全部启动、全部停止"
        - "Open browser / copy entry URL / 打开浏览器、复制入口 URL"
        - "Uninstall / 卸载"
        - "Detach / re-adopt / 移出管理、重新纳入"
        - "Move install root / 移动安装根目录"
        - "Slot health check / repair / 槽体检、修复"
        - "Settings (theme, dirs, visible slots) / 设置（主题、目录、显示哪些槽）"
        - "Other / 其它"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / 复现步骤"
      description: "From opening the manager, step by step / 从打开管理器开始，一步一步写清楚"
      placeholder: |
        1. Open the manager / 打开管理器
        2. Click "Install official dsh", enter 0.2.1-alpha.2 / 点「安装官方版 dsh」，输入 0.2.1-alpha.2
        3. The progress window freezes at "downloading" / 进度窗走到「下载」时停住不动
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected vs actual / 期望的结果与实际的结果"
      placeholder: |
        Expected: a new dshV5 card appears / 期望：装完后多出一张 dshV5 卡片
        Actual: "install failed" popup with no reason / 实际：弹了「安装失败」，但没说原因
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Log excerpt (redacted) / 日志片段（已脱敏）"
      description: "Copy from the log pane at the bottom of the manager / 管理器底部日志区可以直接选中复制"
      render: text
      placeholder: |
        [安装] 开始：官方版 0.2.1-alpha.2 -> 槽 v5
        [v5] npm install 失败（退出码 -4077）...
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: "Screenshots / anything else / 截图、其它补充"
      description: "For UI issues just drag an image into this box / 界面问题请直接贴图，可以把图片拖进这个框"
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: "Before submitting / 提交前确认"
      options:
        - label: "I redacted usernames and absolute paths from the logs / 我已把日志里的用户名和绝对路径做了脱敏"
          required: true
        - label: "I searched existing issues first / 我已搜索过现有 issue，没有重复"
          required: true
