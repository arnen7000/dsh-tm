name: check-all

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # config.json 含本机路径，被 .gitignore 排除；CI 用零槽模板起一份。
      - name: 准备零槽配置
        shell: pwsh
        run: Copy-Item config/config.example.json config.json

      # 项目自己的发布门禁：Python 语法、编码策略、敏感文件、token、
      # Markdown 相对链接、15 套离线回归 + 卫生闸。
      #
      # 失败时把每条 `x ...` **单独输出成 annotation**（网页顶部那几条红字）——
      # 否则所有内容挤在一个 step 的长日志里，网页和 API 都很难定位到底哪项挂了
      # （2026-11-14：CI 连红 20 次，就是卡在"看不到是哪个检查失败"）。
      #
      # 两个 PowerShell 陷阱（前两次改都踩了）：
      #   · `Write-Host` 的输出**不进管道**，`./script.ps1 | Tee-Object` 抓不到
      #   · 管道里的脚本 `exit N` **不影响调用方的 `$LASTEXITCODE`**
      #   · `Write-Host` 写的是 **Information stream（6）**，`2>&1` 只重定向
      #     Error stream，必须用 `*>&1` 才能一起收进来
      # 所以：先 `$out = & ./script *>&1` 捕获全部流，再自己输出和判断。
      - name: 发布前总检
        shell: pwsh
        run: |
          $out = & ./scripts/check-all.ps1 *>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host "$_" }
          $bad = @($out | ForEach-Object { "$_" } | Where-Object { $_ -match '^\s*x\s' })
          foreach ($b in $bad) {
            Write-Host "::error::$($b.Trim())"
          }
          if ($code -ne 0 -or $bad.Count -gt 0) {
            if ($bad.Count -eq 0) {
              Write-Host "::error::check-all 退出码 $code，但没捕获到 x 开头的失败行"
            }
            exit 1
          }
